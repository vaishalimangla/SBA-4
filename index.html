<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="./jscript.js" defer></script>
    <link rel="./stylesheet" href="./script.css" ></link>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" defer></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Task Manager</title>
</head>
<body>

    <h2 class="mt-5 px-5">Add a New Task</h2>
    <form id="taskForm">
     <div class="container py-3 gap-3"> 
        <div class="col-12">
                <div class="py-3"> <label class="me-3" for="iName">Enter the task: </label><input class="px-3" type="text" id="iName" ></div>
                <div class="py-3"> <label class="me-3" for="iCategory">Enter the Category: </label>
                    <select id="iCategory">
                        <option value="work">Work</option>
                        <option value="home">Household</option>
                        <option value="market">Market</option>
                        <option value="fun">Fun</option>
                    </select>
                </div>
                <div class="py-3"> <label class="me-3" for="iDeadline">Enter the deadline: </label><input class="px-3" type="date" id="iDeadline"></div>
                <div class="py-3"> 
                    <label class="me-3" for="iStatus">Enter the status: </label>
                    <select id="iStatus">
                        <option value="Pending">Pending</option>
                        <option value="In Progress">In Progress</option>
                        <option value="Completed">Completed</option>
                        <option value="Overdue">Overdue</option>
                    </select>
                </div>
                <div class="d-flex px-5 gap-5">
                    <button type="button" id="saveBtn">Add Task</button> 
                    <button type="button" id="deleteLastBtn">Delete Task</button>
                </div>
        </div>
    </div>
    </form> 
     <div class="container">      
                
                <h3 class="mt-3">My Tasks</h3>
                <!-- Unordered list container 
                <ul id="taskContainer"></ul>-->
                <table id="taskTable" class="table-bordered">
                    <thead>
                        <tr>
                        <th>Task Name</th>
                        <th class="px-3">
                                <select class="bold" id="filterCategory" placeholder="Filter by Categories...">
                                <option value="All">All Categories</option> 
                                <option value="work">Work</option>
                                <option value="household">Household</option>
                                <option value="market">Market</option>
                                <option value="fun">Fun</option>
                            </select></th>
                        <th class="px-3">
                            <select class="bold" id="filterStatus" placeholder="Filter by status...">
                                <option value="All">All Statuses</option> 
                                <option value="Pending">Pending</option>
                                <option value="In Progress">In Progress</option>
                                <option value="Completed">Completed</option>
                                <option value="Overdue">Overdue</option>
                            </select></th>
                        <th class="px-3">Deadline</th>
                        <th class="px-3">Action</th>
                        </tr>
                    </thead>
                    <tbody id="taskContainer"></tbody>
                </table>

    </div>

        
    </body>
</html>
